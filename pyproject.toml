[project]
name = "terraform-ai-reviewer"
version = "0.1.0"
description = "A deterministic-first Terraform plan reviewer enriched by Amazon Bedrock"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "boto3>=1.42.0,<2",
  "pydantic>=2.12.0,<3",
  "pyyaml>=6.0.2,<7",
]

[project.scripts]
terraform-ai-review = "terraform_ai_reviewer.cli:main"

[dependency-groups]
dev = [
  "checkov>=3.2.0,<4",
  "pytest>=8.4.0,<10",
  "pytest-cov>=6.2.0,<8",
  "ruff>=0.12.0,<1",
]

[build-system]
requires = ["uv_build>=0.9.0,<0.10.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
addopts = "--strict-markers --strict-config"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

